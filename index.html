<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RAG AI Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0a0a0f;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(120, 40, 200, 0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(0, 180, 255, 0.1) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(0, 255, 180, 0.05) 0%, transparent 50%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 780px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    padding: 16px 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    backdrop-filter: blur(20px);
  }

  .logo {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .header-text h1 {
    font-size: 16px;
    font-weight: 600;
    color: #f1f5f9;
    letter-spacing: 0.3px;
  }

  .header-text p {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    margin-top: 1px;
  }

  .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px #22c55e;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Chat window */
  .chat-window {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 4px 2px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }

  .chat-window::-webkit-scrollbar { width: 4px; }
  .chat-window::-webkit-scrollbar-track { background: transparent; }
  .chat-window::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  /* Empty state */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: rgba(255,255,255,0.2);
    text-align: center;
  }

  .empty-state .icon { font-size: 40px; margin-bottom: 4px; }
  .empty-state h2 { font-size: 18px; font-weight: 500; color: rgba(255,255,255,0.3); }
  .empty-state p { font-size: 13px; color: rgba(255,255,255,0.18); }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 16px;
  }

  .suggestion {
    padding: 8px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    transition: all 0.2s;
  }

  .suggestion:hover {
    background: rgba(124, 58, 237, 0.15);
    border-color: rgba(124, 58, 237, 0.4);
    color: rgba(255,255,255,0.7);
  }

  /* Messages */
  .message {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    margin-top: 2px;
  }

  .message.user .avatar {
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
  }

  .message.ai .avatar {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
  }

  .message.user .bubble {
    background: linear-gradient(135deg, rgba(124,58,237,0.5), rgba(6,182,212,0.3));
    border: 1px solid rgba(124,58,237,0.3);
    color: #f1f5f9;
    border-top-right-radius: 4px;
  }

  .message.ai .bubble {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: #cbd5e1;
    border-top-left-radius: 4px;
    backdrop-filter: blur(10px);
  }

  /* Sources */
  .sources {
    margin-top: 10px;
    padding: 8px 12px;
    background: rgba(6,182,212,0.06);
    border: 1px solid rgba(6,182,212,0.15);
    border-radius: 8px;
    font-size: 11px;
    color: rgba(6,182,212,0.7);
  }

  .sources span { display: block; margin-top: 3px; opacity: 0.8; }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 14px 16px;
  }

  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    animation: typing 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 100% { transform: translateY(0); opacity: 0.3; }
    50% { transform: translateY(-4px); opacity: 1; }
  }

  /* Input area */
  .input-area {
    margin-top: 16px;
    padding: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    backdrop-filter: blur(20px);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    transition: border-color 0.2s;
  }

  .input-area:focus-within {
    border-color: rgba(124,58,237,0.4);
    box-shadow: 0 0 0 1px rgba(124,58,237,0.1);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #f1f5f9;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    max-height: 120px;
    min-height: 22px;
    line-height: 1.5;
    padding: 2px 0;
  }

  textarea::placeholder { color: rgba(255,255,255,0.25); }

  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s, transform 0.1s;
  }

  .send-btn:hover { opacity: 0.85; }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .send-btn svg { width: 16px; height: 16px; fill: white; }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.15);
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="logo">🧠</div>
    <div class="header-text">
      <h1>RAG AI Assistant</h1>
      <p>Powered by local documents + Groq</p>
    </div>
    <div class="status">
      <div class="status-dot"></div>
      Local
    </div>
  </div>

  <!-- Chat window -->
  <div class="chat-window" id="chatWindow">
    <div class="empty-state" id="emptyState">
      <div class="icon">✦</div>
      <h2>Ask me anything</h2>
      <p>I'll answer based on your uploaded documents</p>
      <div class="suggestions">
        <div class="suggestion" onclick="sendSuggestion(this)">What is this assignment about?</div>
        <div class="suggestion" onclick="sendSuggestion(this)">What is the remote work policy?</div>
        <div class="suggestion" onclick="sendSuggestion(this)">Explain constructor chaining</div>
        <div class="suggestion" onclick="sendSuggestion(this)">What Java programs are required?</div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <textarea
      id="input"
      placeholder="Ask a question about your documents..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="footer-note">Runs locally · No data leaves your machine</div>

</div>

<script>
    const chatWindow = document.getElementById('chatWindow');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const emptyState = document.getElementById('emptyState');
    let sessionId = "";

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function sendSuggestion(el) {
    input.value = el.textContent;
    sendMessage();
  }

  function addMessage(role, content = '', sources = []) {
    if (emptyState) emptyState.style.display = 'none';

    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = content;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatWindow.appendChild(msg);
    chatWindow.scrollTop = chatWindow.scrollHeight;

    return bubble;
  }

  function addTyping() {
    const msg = document.createElement('div');
    msg.className = 'message ai';
    msg.id = 'typing';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = `
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>`;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatWindow.appendChild(msg);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch('http://localhost:8000/chat', {
    method: 'POST',
     headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text, session_id: sessionId })
    });

    // Save session ID from first response
    if (!sessionId) {
    sessionId = res.headers.get('X-Session-ID') || "";
    }

      removeTyping();
      const bubble = addMessage('ai');
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        fullText += decoder.decode(value, { stream: true });

        // Check if sources marker arrived
        if (fullText.includes('__SOURCES__')) {
          const [answerPart, rest] = fullText.split('__SOURCES__');
          const sourcesPart = rest.replace('__END__', '').trim();
          bubble.textContent = answerPart.trim();

          // Add sources block
          if (sourcesPart && !bubble.querySelector('.sources')) {
            const srcDiv = document.createElement('div');
            srcDiv.className = 'sources';
            srcDiv.innerHTML = '📎 <strong>Sources</strong>' +
              sourcesPart.split('\n').filter(Boolean)
                .map(s => `<span>· ${s}</span>`).join('');
            bubble.appendChild(srcDiv);
          }
        } else {
          bubble.textContent = fullText;
        }

        chatWindow.scrollTop = chatWindow.scrollHeight;
      }
    } catch (err) {
      removeTyping();
      addMessage('ai', '⚠️ Could not connect to the backend. Make sure the server is running.');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
